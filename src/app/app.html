
<div class="d-flex flex-column min-vh-100 pb-5 ">

  <header class="sticky-top z-3">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#"><h4>MySkincareStore</h4></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto d-flex flex-row gap-3 mb-0 list-unstyled">
            <li class="nav-item"><a class="nav-link text-light active" href=""><h4>Home</h4></a></li>
            <li class="nav-item"><a class="nav-link text-secondary" href="#"><h4>Products</h4></a></li>
            <li class="nav-item"><a class="nav-link text-secondary" href="#"><h4>About</h4></a></li>
            <li class="nav-item"><a class="nav-link text-secondary" href="#"><h4>Contact</h4></a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="flex-grow-1">
   
    <app-main-slider></app-main-slider>

    
    <section class="container my-5">
      <h2 class="text-center mb-4 text-primary text-bold"><h3>Featured Products</h3></h2>
      <div class="row g-4">
        <div class="col-12 col-sm-6 col-md-4 col-lg-3" *ngFor="let item of products">
          <app-product-card [product]="item"></app-product-card>
        </div>
      </div>
    </section>
  </main>


  <footer class="bg-dark text-white text-center pb-5 mt-3">
    <div class="container mt-5">
      <p class="mb-0">&copy; 2026 MyStore. All Rights Reserved.</p>
    </div>
  </footer>

</div>
